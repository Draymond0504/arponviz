services:
  api:
    build: .
    command: uvicorn apronops.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - apronops-data:/app/runtime
    environment:
      - APRONOPS_DB_PATH=/app/runtime/apronops.db

  dashboard:
    build: .
    command: streamlit run apronops/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - APRONOPS_API_BASE=http://api:8000
    depends_on:
      - api

volumes:
  apronops-data:
